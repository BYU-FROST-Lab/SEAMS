[build-system]
requires = ["setuptools>=82.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multiSession"
version = "0.1.0"
description = "Multisession development python package"
readme = "README.md"
requires-python = ">=3.12.0, <3.13"

dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "open3d",
    "gtsam",
    "networkx>=3.6.1",
    "kiss-icp>=1.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["common*", "metrics*", "policy*", "params*", "multiSession*", "sparcification*", "ros2*"]
exclude = ["tests*", "environment*",]

[tool.uv.sources]
gtsam = { path = "wheels/gtsam-4.3a1-cp312-cp312-manylinux_2_39_x86_64.whl" }
